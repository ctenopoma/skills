project:
  type: website
  output-dir: _site

lang: ja

# 図・表・リストの採番とキャプション見出し語。PDF 合本(make_pdf.py → qtpdf book)
# 側にも同じ設定が入っており、HTML と PDF で「図 / 表 / リスト」の呼び方を揃える
crossref:
  fig-title: "図"
  fig-prefix: "図"
  tbl-title: "表"
  tbl-prefix: "表"
  lst-title: "リスト"
  lst-prefix: "リスト"
  sec-prefix: "節"
  title-delim: ": "

website:
  title: "legacy-reverse 設計・仕様書"
  search:
    location: navbar
    type: overlay
  navbar:
    background: dark
    left:
      - text: "全体像"
        href: index.qmd
      - text: "スキル設計"
        href: architecture.qmd
      - text: "画面設計"
        href: screens.qmd
      - text: "MCPサーバ"
        href: mcp-server.qmd
      - text: "運用設計"
        href: operations.qmd
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - section: "全体"
        contents:
          - text: "全体像(まずここ)"
            href: index.qmd
      - section: "スキル設計(詳細)"
        contents:
          - text: "アーキテクチャと設計判断"
            href: architecture.qmd
          - text: "パイプライン仕様(⓪〜⑦)"
            href: pipeline.qmd
          - text: "データ仕様"
            href: data.qmd
          - text: "品質ゲート仕様"
            href: quality.qmd
      - section: "画面(詳細)"
        contents:
          - text: "画面設計"
            href: screens.qmd
      - section: "MCPサーバ(詳細)"
        contents:
          - text: "legacy-reverse-mcp 仕様"
            href: mcp-server.qmd
      - section: "運用(詳細)"
        contents:
          - text: "運用設計"
            href: operations.qmd
  page-footer:
    center: "legacy-reverse 設計・仕様書 — skills リポジトリ docs/legacy-reverse"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: "このページの目次"
    number-sections: false
    code-overflow: wrap
    smooth-scroll: true
    # neutral を明示しないと subgraph のクラスタ背景が濃色になり、
    # 中のノード文字が読めなくなる(既定テーマは本文テーマの色を拾うため)
    mermaid:
      theme: neutral
